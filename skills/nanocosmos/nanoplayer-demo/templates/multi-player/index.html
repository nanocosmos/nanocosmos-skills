<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;700&family=Source+Sans+3:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="product-theme.css">
<link rel="stylesheet" href="page.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <img class="logo-lockup" src="https://www.nanocosmos.net/wp-content/uploads/2026/06/nanoStream-logo-V1.webp" alt="nanoStream">
        <div class="header-divider"></div>
        <div class="nav-label"><span class="title">{{TITLE}}</span></div>
      </div>
      <div class="header-right">
        <a href="https://dashboard.nanostream.cloud/signup" target="_blank" rel="noopener" class="theme-pill">Start for free</a>
        <a href="https://www.nanocosmos.net/support/" target="_blank" rel="noopener" class="theme-pill">Contact</a>
        <img class="brand-mark" src="https://www.nanocosmos.net/wp-content/uploads/2025/03/Nanocosmos_logo_RGB_on-dark-bg.png" alt="nanocosmos">
      </div>
    </div>
  </header>

  <main>
    <div class="container">

      <section class="panel form-panel">
        <div class="field" id="sourceField">
          <label for="sourceInput" id="sourceLabel">Group ID (all tiles)</label>
          <div class="field-control">
            <input type="text" id="sourceInput" autocomplete="off" spellcheck="false">
            <span class="helper">Every tile plays this group; only each tile's settings differ. URL: ?group= · ?token= · ?groups=a,b,c (one tile per group, up to 9) · ?server=</span>
          </div>
        </div>
        <div class="button-row">
          <button class="btn btn-primary" id="btnLoad">Load All</button>
          <button class="btn btn-secondary" id="btnStop">Stop All</button>
        </div>
        <p class="helper form-note" id="formNote"></p>
      </section>

      <div class="player-grid" id="grid"></div>

      <template id="tileTemplate">
        <section class="panel player-panel">
          <div class="video-surface"><div class="player-host"></div></div>
          <div class="status-bar">
            <div class="status-left">
              <span class="tile-label"></span>
              <span class="badge paused"><span class="dot"></span><span class="badge-text">Idle</span></span>
              <span class="status-text"></span>
            </div>
            <div class="status-right">Bitrate — · Buffer delay — (target —)</div>
          </div>
        </section>
      </template>

      <section class="panel config-panel" id="configPanel">
        <button class="raw-toggle" id="configToggle" aria-expanded="false" aria-controls="configJson">
          <span>Configuration: what nanoPlayer receives (copy it into your page)</span><span class="chevron">›</span>
        </button>
        <pre class="raw-payload" id="configJson">—</pre>
        <div class="button-row config-actions">
          <button class="btn btn-secondary" id="btnCopyConfig">Copy configuration</button>
          <span class="copy-confirm" id="configCopied">Copied</span>
        </div>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 <a href="https://www.nanocosmos.net">nanocosmos</a> GmbH</span>
      <div class="page-version" aria-label="Page version">
        <span>v<!-- version -->1.0.0<!-- /version --></span>
        <span aria-hidden="true">·</span>
        <span>Updated <!-- updated -->{{DATE}}<!-- /updated --></span>
      </div>
    </div>
  </footer>

<script src="https://demo.nanocosmos.de/nanoplayer/api/release/nanoplayer.5.min.js"></script>
<script src="js/demo-core.js"></script>
<script>
(function () {
  'use strict';
  // ── Player configuration ────────────────────────────────────────────────
  // This object is what nanoPlayer receives (the demo only adds event
  // handlers). Edit it to change the demo; the Configuration panel on the
  // page shows the result and lets you copy it.
  // Reference: https://docs.nanocosmos.de/docs/nanoplayer/nanoplayer_api
  var PLAYER_CONFIG = {
    source: {
      group: {
        id: '',                 // your bintu stream group ID (required). URL: ?group=
        startQuality: 'medium', // high | medium-high | medium | medium-low | low (default low)
        security: {}            // secure playback: { jwtoken: '…' }. URL: ?token=
        // apiurl: 'https://bintu.nanocosmos.de' // optional, this is the default
      },
      options: {
        adaption: { rule: 'deviationOfMean2' }, // ABR on. 'none' = keep the start quality
        switch: { method: 'server', pauseOnError: false, forcePlay: true, timeout: 20 }
      }
    },
    playback: {
      autoplay: true,
      automute: true,  // if the browser blocks sound, start muted instead of not at all
      muted: true,     // several tiles at once: sound from all of them would overlap (docs default: false)
      faststart: true,
      enableMediaOverQuic: true, // MoQ where the browser supports it, else WebSocket
      latencyControlMode: 'balancedadaptive' // classic | fastadaptive | balancedadaptive
    },
    style: {
      width: '100%', height: '100%', // fills the page's video area
      scaling: 'letterbox',          // letterbox | fill | crop
      controls: false                // the demo has its own controls
    }
  };

  // ── Tiles ───────────────────────────────────────────────────────────────
  // Each tile plays PLAYER_CONFIG with its override merged in. The default
  // compares transports on the same group. ?groups=a,b,c instead gives one
  // tile per group with no override.
  var TILES = [
    { label: 'H5Live (WebSocket)', override: { playback: { enableMediaOverQuic: false } } },
    { label: 'Media over QUIC (MoQ)', override: { playback: { enableMediaOverQuic: true } } }
  ];
  var MAX_TILES = 9;

  var D = NanoDemo;
  var $ = function (id) { return document.getElementById(id); };
  var ui = {
    source: $('sourceInput'), sourceLabel: $('sourceLabel'), sourceField: $('sourceField'),
    grid: $('grid'), tpl: $('tileTemplate'), note: $('formNote')
  };
  var panel = D.mountConfigPanel({
    toggle: $('configToggle'), pre: $('configJson'), copy: $('btnCopyConfig'), confirm: $('configCopied')
  });
  var tiles = [];

  function parseList(text) {
    return String(text || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  }

  var config;
  try {
    config = D.applyUrlParams(PLAYER_CONFIG, location.search);
  } catch (err) {
    ui.note.textContent = err.message;
    panel.render(PLAYER_CONFIG);
    return;
  }

  var groups = parseList(new URLSearchParams(location.search).get('groups'));
  if (groups.length) {
    if (groups.length > MAX_TILES) {
      ui.note.textContent = 'Showing the first ' + MAX_TILES + ' of ' + groups.length + ' groups.';
    }
    TILES = groups.slice(0, MAX_TILES).map(function (id) {
      return { label: id, override: { source: { group: { id: id } } } };
    });
    ui.sourceField.classList.add('is-hidden');
  }

  function stopAll() {
    tiles.forEach(function (t) { t.ctl.stop(); });
  }

  function buildTiles() {
    stopAll();
    tiles = [];
    ui.grid.textContent = '';
    TILES.forEach(function (tile, i) {
      var node = ui.tpl.content.firstElementChild.cloneNode(true);
      var host = node.querySelector('.player-host');
      host.id = 'player-' + i;
      node.querySelector('.tile-label').textContent = tile.label;
      ui.grid.appendChild(node);
      var status = D.statusHandlers({
        badge: node.querySelector('.badge'),
        badgeText: node.querySelector('.badge-text'),
        text: node.querySelector('.status-text'),
        stats: node.querySelector('.status-right')
      });
      tiles.push({ tile: tile, ctl: D.createController(host.id, status) });
    });
  }

  function loadAll() {
    if (!groups.length) { config = D.withSourceId(config, ui.source.value); }
    buildTiles();
    var shown = tiles.map(function (t) {
      return { tile: t.tile.label, config: D.mergeConfig(config, t.tile.override) };
    });
    panel.render(shown);
    tiles.forEach(function (t, i) { t.ctl.load(shown[i].config); });
  }

  ui.sourceLabel.textContent = config.source.group ? 'Group ID (all tiles)' : 'Stream name (all tiles)';
  ui.source.value = D.sourceId(config);
  $('btnLoad').addEventListener('click', loadAll);
  $('btnStop').addEventListener('click', stopAll);
  ui.source.addEventListener('keydown', function (e) { if (e.key === 'Enter') { loadAll(); } });
  loadAll();
})();
</script>
</body>
</html>
