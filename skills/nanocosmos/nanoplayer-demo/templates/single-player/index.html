<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;700&family=Source+Sans+3:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="product-theme.css">
<link rel="stylesheet" href="page.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <img class="logo-lockup" src="https://www.nanocosmos.net/wp-content/uploads/2026/06/nanoStream-logo-V1.webp" alt="nanoStream">
        <div class="header-divider"></div>
        <div class="nav-label"><span class="title">{{TITLE}}</span></div>
      </div>
      <div class="header-right">
        <a href="https://dashboard.nanostream.cloud/signup" target="_blank" rel="noopener" class="theme-pill">Start for free</a>
        <a href="https://www.nanocosmos.net/support/" target="_blank" rel="noopener" class="theme-pill">Contact</a>
        <img class="brand-mark" src="https://www.nanocosmos.net/wp-content/uploads/2025/03/Nanocosmos_logo_RGB_on-dark-bg.png" alt="nanocosmos">
      </div>
    </div>
  </header>

  <main>
    <div class="container">

      <section class="panel form-panel">
        <div class="field">
          <label for="sourceInput" id="sourceLabel">Group ID</label>
          <div class="field-control">
            <input type="text" id="sourceInput" autocomplete="off" spellcheck="false">
            <span class="helper">bintu stream group ID (ABR). URL: ?group= · ?token= · ?stream=XXXXX-YYYYY for a single stream · ?server=</span>
          </div>
        </div>
        <div class="button-row">
          <button class="btn btn-primary" id="btnLoad">Load</button>
          <button class="btn btn-secondary" id="btnStop">Stop</button>
        </div>
      </section>

      <section class="panel player-panel">
        <div class="video-surface"><div id="player" class="player-host"></div></div>
        <div class="status-bar">
          <div class="status-left">
            <span class="badge paused" id="statusBadge"><span class="dot"></span><span id="statusBadgeText">Idle</span></span>
            <span class="status-text" id="statusText"></span>
          </div>
          <div class="status-right" id="statusRight">Bitrate — · Buffer delay — (target —)</div>
        </div>
      </section>

      <section class="panel config-panel" id="configPanel">
        <button class="raw-toggle" id="configToggle" aria-expanded="false" aria-controls="configJson">
          <span>Configuration: what nanoPlayer receives (copy it into your page)</span><span class="chevron">›</span>
        </button>
        <pre class="raw-payload" id="configJson">—</pre>
        <div class="button-row config-actions">
          <button class="btn btn-secondary" id="btnCopyConfig">Copy configuration</button>
          <span class="copy-confirm" id="configCopied">Copied</span>
        </div>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 <a href="https://www.nanocosmos.net">nanocosmos</a> GmbH</span>
      <div class="page-version" aria-label="Page version">
        <span>v<!-- version -->1.0.0<!-- /version --></span>
        <span aria-hidden="true">·</span>
        <span>Updated <!-- updated -->{{DATE}}<!-- /updated --></span>
      </div>
    </div>
  </footer>

<script src="https://demo.nanocosmos.de/nanoplayer/api/release/nanoplayer.5.min.js"></script>
<script src="js/demo-core.js"></script>
<script>
(function () {
  'use strict';
  // ── Player configuration ────────────────────────────────────────────────
  // This object is what nanoPlayer receives (the demo only adds event
  // handlers). Edit it to change the demo; the Configuration panel on the
  // page shows the result and lets you copy it.
  // Reference: https://docs.nanocosmos.de/docs/nanoplayer/nanoplayer_api
  var PLAYER_CONFIG = {
    source: {
      group: {
        id: 'b6638d50-3581-4349-8fb2-59b3406c2dde', // bintu stream group (ABR). URL: ?group=
        startQuality: 'medium', // high | medium-high | medium | medium-low | low (default low)
        security: {}            // secure playback: { jwtoken: '…' }. URL: ?token=
        // apiurl: 'https://bintu.nanocosmos.de' // optional, this is the default
      },
      options: {
        adaption: { rule: 'deviationOfMean2' }, // ABR on. 'none' = keep the start quality
        switch: { method: 'server', pauseOnError: false, forcePlay: true, timeout: 20 }
      }
    },
    playback: {
      autoplay: true,
      automute: true,  // if the browser blocks sound, start muted instead of not at all
      muted: false,    // try with sound first
      faststart: true,
      enableMediaOverQuic: true, // MoQ where the browser supports it, else WebSocket
      latencyControlMode: 'balancedadaptive' // classic | fastadaptive | balancedadaptive
    },
    style: {
      width: '100%', height: '100%', // fills the page's video area
      scaling: 'letterbox',          // letterbox | fill | crop
      controls: false                // the demo has its own controls
    }
  };

  var D = NanoDemo;
  var $ = function (id) { return document.getElementById(id); };
  var ui = {
    source: $('sourceInput'), sourceLabel: $('sourceLabel'),
    badge: $('statusBadge'), badgeText: $('statusBadgeText'),
    text: $('statusText'), stats: $('statusRight')
  };
  var status = D.statusHandlers(ui);
  var ctl = D.createController('player', status);
  var panel = D.mountConfigPanel({
    toggle: $('configToggle'), pre: $('configJson'), copy: $('btnCopyConfig'), confirm: $('configCopied')
  });

  // URL params (?group= ?token= ?stream= ?server=) change a copy of PLAYER_CONFIG.
  var config;
  try {
    config = D.applyUrlParams(PLAYER_CONFIG, location.search);
  } catch (err) {
    status.onState('error');
    status.onError(err.message);
    panel.render(PLAYER_CONFIG);
    return;
  }

  function load() {
    config = D.withSourceId(config, ui.source.value);
    panel.render(config);
    ctl.load(config);
  }

  ui.sourceLabel.textContent = config.source.group ? 'Group ID' : 'Stream name';
  ui.source.value = D.sourceId(config);
  $('btnLoad').addEventListener('click', load);
  $('btnStop').addEventListener('click', function () { ctl.stop(); });
  ui.source.addEventListener('keydown', function (e) { if (e.key === 'Enter') { load(); } });
  load();
})();
</script>
</body>
</html>
